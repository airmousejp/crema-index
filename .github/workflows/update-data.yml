name: Update Crema data

on:
  schedule:
    # GitHub cron은 수 시간 지연될 수 있어 슬롯 4개로 분산 (붐비는 :00/:30 대신 :07 사용)
    - cron: '7 21 * * 1-5'   # KST 06:07 (미국 장 마감 직후)
    - cron: '7 23 * * 1-5'   # KST 08:07
    - cron: '7 1 * * 2-6'    # KST 10:07 (UTC 자정이 지나 요일이 화~토)
    - cron: '7 3 * * 2-6'    # KST 12:07
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch market data
        shell: pwsh
        run: ./update-data.ps1
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js history-data.js
          git diff --cached --quiet || git commit -m "chore: update market data"
          git push
